---
layout: portfolio
home: true
---
{% assign profile = site.data.profile %}
<section class="hero" aria-labelledby="intro-title">
  <div class="hero-copy">
    <h1 id="intro-title">Amirmohammad<br>Mohammadi<span class="accent-dot">.</span></h1>
    <p class="hero-affiliation">PhD from Texas A&M University</p>
    <p class="hero-description">{{ profile.summary }}</p>
    <div class="actions"><a class="button" href="{{ '/research/' | relative_url }}">Explore my research <span aria-hidden="true">↗</span></a><a class="button button--outline" href="{{ profile.cv | relative_url }}">View CV</a></div>
    <ul class="resource-links hero-links"><li><a href="mailto:{{ profile.email }}">Email</a></li><li><a href="{{ profile.scholar }}">Google Scholar</a></li><li><a href="{{ profile.linkedin }}">LinkedIn</a></li></ul>
  </div>
  <figure class="portrait"><picture><source type="image/webp" srcset="{{ '/assets/images/portrait.webp' | relative_url }}"><img src="{{ '/assets/images/portrait.jpg' | relative_url }}" width="456" height="562" alt="Amir Mohammadi wearing a Texas A&M shirt" fetchpriority="high" decoding="async"></picture></figure>
</section>
